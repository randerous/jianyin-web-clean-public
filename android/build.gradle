// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        maven { url uri("local-maven") }
        // 官方源在前、国内镜像兜底：镜像可能返回 5xx（实测
        // maven.aliyun.com/repository/google 返回 502），而任一仓库硬失败会
        // 让 Gradle 连带禁用整个 repository 并中止构建。
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        if (file("app/google-services.json").exists()) {
            classpath 'com.google.gms:google-services:4.4.4'
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def externalGradleBuildDir = System.getenv("JIANYIN_ANDROID_GRADLE_BUILD_DIR")
if (externalGradleBuildDir) {
    rootProject.layout.buildDirectory.set(new File(externalGradleBuildDir, "root"))
    subprojects { subproject ->
        subproject.layout.buildDirectory.set(new File(externalGradleBuildDir, subproject.name))
        if (subproject.name == "capacitor-cordova-android-plugins") {
            subproject.pluginManager.withPlugin("com.android.library") {
                subproject.android.externalNativeBuild.cmake.buildStagingDirectory =
                    new File(externalGradleBuildDir, "${subproject.name}-cxx")
            }
        }
    }
}

allprojects {
    repositories {
        maven { url uri("${rootProject.projectDir}/local-maven") }
        google()
        mavenCentral()
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
    }
}

def removeAppleDoubleMetadata = {
    rootProject.delete(rootProject.fileTree(rootProject.projectDir) {
        include 'app/build/**/._*'
        include 'app/.cxx/**/._*'
        include 'app/src/main/assets/**/._*'
        include 'app/src/main/res/**/._*'
        include 'capacitor-cordova-android-plugins/build/**/._*'
        include 'capacitor-cordova-android-plugins/.cxx/**/._*'
        include 'capacitor-cordova-android-plugins/src/main/assets/**/._*'
        include 'capacitor-cordova-android-plugins/src/main/java/**/._*'
        include 'capacitor-cordova-android-plugins/src/main/libs/**/._*'
        include 'capacitor-cordova-android-plugins/src/main/res/**/._*'
    })
}

gradle.projectsEvaluated {
    subprojects { subproject ->
        subproject.tasks.configureEach { task ->
            if (task.name.startsWith('bundleLibRuntimeToDir') || task.name.startsWith('compile')) {
                task.doLast { removeAppleDoubleMetadata() }
            }
            if (task.name.startsWith('dex') || task.name.startsWith('mergeLibDex')) {
                task.doFirst { removeAppleDoubleMetadata() }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
