name: Windows launcher EXE

on:
  push:
    tags:
      - "v*"
    # paths 只约束分支推送；tag 推送不匹配 paths 会被整体跳过，
    # 因此 tag 触发不能与 paths 并列，改为在 job 内按 ref 判断。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    # tag 推送一律构建（要发版）；分支推送只在 Launcher/打包脚本/服务端变动时构建，
    # 保持原有的 paths 过滤意图。
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.commits[*].modified, 'windows/Launcher.cs') ||
      contains(github.event.commits[*].modified, 'scripts/build-windows-launcher.ps1') ||
      contains(github.event.commits[*].modified, 'server.mjs') ||
      contains(github.event.commits[*].modified, 'package.json') ||
      contains(github.event.commits[*].modified, 'package-lock.json')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/windows-launcher.test.mjs
      - name: Build launcher EXE
        shell: powershell
        run: scripts/build-windows-launcher.ps1
      - name: Rename launcher to the release asset name
        shell: powershell
        run: |
          # 构建产物是中文名「启动既见.exe」，而 windows/Launcher.cs:350 与
          # server.mjs 只认资产名 jianyin-windows-launcher.exe，发布前统一改名。
          $built = Get-ChildItem -Filter "*.exe" | Where-Object { $_.Name -ne "node.exe" } | Select-Object -First 1
          if (-not $built) { throw "Launcher EXE was not generated" }
          Move-Item $built.FullName "jianyin-windows-launcher.exe" -Force
          Get-ChildItem -Filter "*.exe" | Select-Object Name, Length
      - name: Smoke test EXE and embedded server
        shell: powershell
        run: |
          $env:JIANYIN_LAUNCHER_SMOKE = "1"
          $exe = Get-Item "jianyin-windows-launcher.exe"
          if (-not $exe) { throw "Launcher EXE was not found after rename" }
          $process = Start-Process $exe.FullName -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Launcher smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Launcher smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: jianyin-windows-launcher
          path: "*.exe"
          if-no-files-found: error

      - name: Publish launcher to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXE=jianyin-windows-launcher.exe
          test -f "$EXE" || { echo "::error::$EXE missing"; exit 1; }
          SHA256=$(sha256sum "$EXE" | awk '{print $1}')
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$EXE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "${TAG}" \
              --notes "桌面版与 Android 版资产随 CI 分别上传，完整发布说明见 CHANGELOG.md。" \
              --verify-tag
          fi
          echo "Published $EXE to $TAG"
          echo "SHA-256: $SHA256"
