name: Desktop launchers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-launchers.yml"
      - "scripts/start-desktop.mjs"
      - "start-jianyin-macos.command"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/desktop-launchers.yml"
      - "scripts/start-desktop.mjs"
      - "start-jianyin-macos.command"
      - "package.json"
      - "package-lock.json"

jobs:
  launch:
    strategy:
      matrix:
        include:
          - os: macos-latest
            launcher: ./start-jianyin-macos.command
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PORT: 5210
      JIANYIN_NO_OPEN: 1
      JIANYIN_EXIT_AFTER_READY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Launch desktop app
        run: ${{ matrix.launcher }}
